<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipdao · Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF8F3; --rice:#F5F1EA; --panel:#FFFFFF; --ink:#1E1512; --ink2:#4A3F3A; --muted:#8A7F78;
  --line:#E8E1D6; --red:#B5301F; --red-soft:#F6E3DF; --green:#2F7A4B; --green-soft:#E2F1E7;
  --amber:#9A6A12; --amber-soft:#F7EDD6; --blue:#2D5B8C; --blue-soft:#E3ECF6;
  --r:12px; --serif:"Noto Serif SC",Georgia,serif; --sans:"Instrument Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--red)}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.01em}
h1{font-size:30px} h2{font-size:22px} h3{font-size:17px;font-weight:500}
.muted{color:var(--muted)} .small{font-size:13px}
button,.btn{font:500 14px var(--sans);border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:9px 18px;cursor:pointer;transition:opacity .15s}
button:hover{opacity:.85} button:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.ghost:hover{border-color:var(--ink);opacity:1}
button.red,.btn.red{background:var(--red);border-color:var(--red);color:#fff}
button.sm{padding:5px 12px;font-size:13px}
input,select,textarea{font:14px var(--sans);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:transparent}
label{display:block;font-size:13px;color:var(--ink2);margin:0 0 5px}
.field{margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stat .k{font-size:13px;color:var(--muted)} .stat .v{font:400 28px var(--serif);margin-top:4px;font-variant-numeric:tabular-nums}
.seal{width:34px;height:34px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font:500 18px var(--serif);border:1px dashed rgba(255,255,255,.5);outline:2px solid var(--red)}
/* layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);padding:22px 16px;background:var(--rice);display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:10px;align-items:center;font:500 18px var(--serif)}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:14px}
.nav a:hover{background:#fff} .nav a.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.nav .sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 10px 6px}
.badge{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.main{padding:32px 40px 60px;max-width:1180px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.who{margin-top:auto;font-size:13px;color:var(--muted)}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 16px}
  .nav{display:flex;gap:4px;overflow-x:auto;order:3;width:100%;-webkit-overflow-scrolling:touch}.nav a{white-space:nowrap;gap:6px}.nav .sec{display:none}
  .who{margin:0 0 0 auto;text-align:right}.main{padding:22px 16px}}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
@media(max-width:820px){.scroll .tbl{min-width:640px}}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--rice);color:var(--ink2)}
.p-paid,.p-accepted,.p-active,.p-connected{background:var(--green-soft);color:var(--green)}
.p-shipped,.p-delivered,.p-quoted,.p-sent_to_agent{background:var(--blue-soft);color:var(--blue)}
.p-on_hold,.p-requested,.p-lead,.p-new{background:var(--amber-soft);color:var(--amber)}
.p-priced{background:var(--green-soft);color:var(--green)} .p-sourcing{background:var(--blue-soft);color:var(--blue)} .p-to_source{background:var(--amber-soft);color:var(--amber)} .p-skip{background:var(--rice);color:var(--muted)}
.p-issue,.p-declined,.p-cancelled,.p-uninstalled,.p-paused{background:var(--red-soft);color:var(--red)}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth .card{width:100%;max-width:420px;padding:32px}
.tabs{display:flex;gap:6px;margin:18px 0}
.tabs button{flex:1}
/* misc */
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50;align-items:flex-end}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.err{background:var(--red)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.search{max-width:280px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--rice);border:1px solid var(--line);display:block}
.ptbl td{vertical-align:middle;padding:8px 6px}.ptbl th{padding:8px 6px}.ptbl input,.ptbl select{padding:6px 7px;font-size:13px}.ptbl .n{width:62px}
.main.wide{max-width:1480px}
.ptbl tr.dirty td{background:#FFFBF2}
.sticky{position:sticky;bottom:16px;display:flex;justify-content:flex-end;margin-top:12px;pointer-events:none}.sticky>*{pointer-events:auto}
.item-row{display:grid;grid-template-columns:2fr 2fr 100px 130px 34px;gap:8px;margin-bottom:8px}
@media(max-width:820px){.item-row{grid-template-columns:1fr}}
.cost-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media(max-width:820px){.cost-grid{grid-template-columns:repeat(2,1fr)}}
dialog{border:1px solid var(--line);border-radius:var(--r);padding:24px;max-width:440px;width:92%}
dialog::backdrop{background:rgba(30,21,18,.35)}
.hr{height:1px;background:var(--line);margin:18px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:transparent;color:var(--ink2);border-color:var(--line)}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pub{min-height:100vh;background:var(--paper)}
.pnav{position:sticky;top:0;z-index:20;background:rgba(251,248,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.pnav .in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px}
.pnav .links{display:flex;gap:18px;margin-left:auto;font-size:14px}.pnav .links a{color:var(--ink2);text-decoration:none}.pnav .links a:hover{color:var(--ink)}
.pnav .cta{display:flex;gap:8px}.pnav .cta a{text-decoration:none}
@media(max-width:900px){.pnav .links{display:none}.pnav .cta{margin-left:auto}}
.psec{max-width:1120px;margin:0 auto;padding:72px 20px}.psec.tight{padding-top:24px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
.hero{padding:88px 20px 40px;text-align:center;max-width:860px;margin:0 auto}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.08}
.hero p{font-size:18px;color:var(--ink2);max-width:640px;margin:18px auto 28px}
.btn.lg,button.lg{padding:13px 24px;font-size:15px}a.btn{text-decoration:none;display:inline-block}a.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.ink{display:block;width:100%;height:120px;color:var(--line)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:32px}@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}@media(max-width:560px){.steps{grid-template-columns:1fr}}
.step .n{font:400 34px var(--serif);color:var(--red)}.step h3{margin:8px 0 6px}.step p{color:var(--ink2);font-size:14px;margin:0}
.big{font:400 40px var(--serif);color:var(--ink)}
.cmp{width:100%;border-collapse:collapse;margin-top:28px;font-size:14px}.cmp th,.cmp td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{font-weight:500;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.cmp td.us{background:var(--green-soft)}.cmp .no{color:var(--muted)}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}.faq summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:12px}.faq summary::after{content:"+";color:var(--muted)}.faq details[open] summary::after{content:"–"}
.faq details p{color:var(--ink2);margin:10px 0 0}
.band{background:var(--ink);color:#fff;border-radius:20px;padding:48px 32px;text-align:center}.band h2{color:#fff;font-size:30px}.band p{color:rgba(255,255,255,.7)}
.pfoot{border-top:1px solid var(--line);margin-top:40px}.pfoot .in{max-width:1120px;margin:0 auto;padding:36px 20px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px;font-size:14px;color:var(--ink2)}
.pfoot a.brand{display:flex;margin:0}.pfoot .foot{text-align:left;margin-top:14px}.pfoot .foot a{display:inline;margin:0}
.pfoot a{color:var(--ink2);display:block;text-decoration:none;margin:3px 0}.pfoot a:hover{color:var(--ink)}.pfoot h4{font:500 12px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
@media(max-width:700px){.pfoot .in{grid-template-columns:1fr}}
.docs{display:grid;grid-template-columns:220px 1fr;gap:40px;max-width:1120px;margin:0 auto;padding:40px 20px 60px}
.docs nav{position:sticky;top:76px;align-self:start;font-size:14px}.docs nav a{display:block;color:var(--ink2);text-decoration:none;padding:4px 0}.docs nav a:hover{color:var(--red)}
.docs article h2{margin:44px 0 10px;padding-top:10px;border-top:1px solid var(--line)}.docs article h3{margin:22px 0 6px}.docs article p,.docs article li{color:var(--ink2)}
.docs .num{color:var(--red);font-family:var(--serif);margin-right:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:14px;margin:10px 0}.kv dt{font-weight:500}.kv dd{margin:0;color:var(--ink2)}
@media(max-width:820px){.docs{grid-template-columns:1fr}.docs nav{position:static}.kv{grid-template-columns:1fr}}
.p-unpaid{background:var(--rice);color:var(--muted)} .p-address_error{background:var(--red-soft);color:var(--red)} .p-reported{background:var(--amber-soft);color:var(--amber)} .p-rejected{background:var(--red-soft);color:var(--red)}
dialog.wide{max-width:760px}
.thread{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--rice);border-radius:10px;margin:8px 0}
.msg{max-width:80%;padding:8px 12px;border-radius:12px;font-size:14px;background:#fff;border:1px solid var(--line);white-space:pre-wrap}
.msg.mine{align-self:flex-end;background:var(--ink);color:#fff;border-color:var(--ink)}.msg .t{font-size:11px;opacity:.6;margin-top:3px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--rice)}
.dot{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.filters input{width:auto}
.qc{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.qc a{display:block}.qc img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.ag-card{margin-bottom:12px}.ag-items{display:grid;gap:8px;margin:10px 0}.ag-item{display:flex;gap:10px;align-items:center}
.ag-addr{background:var(--rice);border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-line}
.ag-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}@media(max-width:820px){.ag-grid{grid-template-columns:1fr}}
.zh{color:var(--muted);font-size:12px;margin-left:4px}
.legal{max-width:760px;margin:0 auto;padding:40px 20px 80px}.legal h1{margin:18px 0 6px}.legal h2{font-size:19px;margin:26px 0 8px}.legal p,.legal li{color:var(--ink2)}.legal ol,.legal ul{padding-left:20px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.7}.foot a{color:var(--muted)}
.amounts{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink2);margin:4px 0 12px}.check input{width:auto;margin-top:3px}
.notice{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:12px 14px;font-size:14px}
.steps-list{margin:0 0 0 18px;padding:0;display:grid;gap:10px;font-size:14px}.steps-list li{padding-left:4px}
</style>
</head>
<body>
<div id="root"></div>
<dialog id="dlg"></dialog>

<script type="module" src="app.js?v=20261118"></script>
</body>
</html>
